    <rect x="1150" y="272" width="580" height="74" rx="18" fill="#122a40"/>
    <text x="1190" y="319" fill="#ecf5fb" font-family="DejaVu Sans,Arial,sans-serif" font-size="25" font-weight="700">RESPONSE REVIEW</text>
    <circle cx="1664" cy="309" r="8" fill="#37e0c5"/><circle cx="1692" cy="309" r="8" fill="#4e7cff"/>
    <g font-family="DejaVu Sans,Arial,sans-serif">
