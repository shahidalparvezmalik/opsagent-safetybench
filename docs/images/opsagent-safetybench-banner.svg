      <text x="1232" y="416" fill="#9bb5c9" font-size="16" letter-spacing="1">EVIDENCE CHECK</text><text x="1232" y="445" fill="#ecf5fb" font-size="22">Monitoring and scope</text>
      <rect x="1150" y="486" width="580" height="84" rx="17" fill="#10263b" stroke="#28516b"/>
      <circle cx="1194" cy="528" r="19" fill="#0d4b53"/><path d="m1185 528 7 7 13-15" fill="none" stroke="#69f0d6" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
