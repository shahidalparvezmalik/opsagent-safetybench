<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="title desc">
  <title id="title">OpsAgent SafetyBench</title>
  <desc id="desc">A synthetic, text-only benchmark for reviewing AI assistants' written responses to IT operations incidents.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071426"/><stop offset="1" stop-color="#102a43"/></linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#00d7c4" stop-opacity=".26"/><stop offset="1" stop-color="#1677ff" stop-opacity=".02"/></linearGradient>
    <pattern id="grid" width="64" height="64" patternUnits="userSpaceOnUse"><path d="M64 0H0V64" fill="none" stroke="#8db3cf" stroke-opacity=".09" stroke-width="1"/></pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="22" stdDeviation="24" flood-color="#000" flood-opacity=".3"/></filter>
  </defs>
  <rect width="1920" height="1080" fill="url(#bg)"/>
  <rect width="1920" height="1080" fill="url(#grid)"/>
  <circle cx="1570" cy="210" r="470" fill="url(#glow)"/>
  <path d="M0 850C400 750 620 990 1040 860s620-230 880-150v370H0Z" fill="#06101f" fill-opacity=".45"/>
  <rect x="115" y="105" width="510" height="58" rx="29" fill="#0e3343" stroke="#2ed8c7" stroke-opacity=".65"/>
  <circle cx="148" cy="134" r="8" fill="#32e1ca"/>
