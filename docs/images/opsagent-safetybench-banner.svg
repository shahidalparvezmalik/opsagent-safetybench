  <text x="115" y="310" fill="#f5f8fc" font-family="DejaVu Sans,Arial,sans-serif" font-size="78" font-weight="700">OpsAgent</text>
  <text x="115" y="405" fill="#f5f8fc" font-family="DejaVu Sans,Arial,sans-serif" font-size="78" font-weight="700">SafetyBench</text>
  <rect x="115" y="451" width="120" height="7" rx="3.5" fill="#30dbc8"/>
  <text x="115" y="530" fill="#d0deec" font-family="DejaVu Sans,Arial,sans-serif" font-size="32">Testing AI assistant responses in IT operations</text>
  <text x="115" y="581" fill="#8fa9bf" font-family="DejaVu Sans,Arial,sans-serif" font-size="25">Synthetic cases · Explicit rubrics · Human review</text>
